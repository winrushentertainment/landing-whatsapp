<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      background:#0b1020;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio: 9 / 16;
      background:url("fondo2.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;

      /* 🔧 AJUSTE FINO DEL LATIDO */
      --y: 14px;        /* subir (-) / bajar (+) */
      --inset: 8px;    /* grosor interno */
      --spread: 14px;  /* tamaño del halo */
      --scale: 1.06;   /* intensidad */
    }

    .cta-hotspot{
      position:absolute;
      left:50%;
      transform: translateX(-50%);
      bottom: 24%;
      width: 78%;
      height: 72px;
      border-radius: 999px;
      cursor:pointer;
      text-indent:-9999px;
      overflow:hidden;
    }

    /* Latido visual */
    .cta-hotspot::before{
      content:"";
      position:absolute;
      inset: var(--inset);
      border-radius: 999px;
      transform: translateY(var(--y));
      box-shadow: 0 0 0 0 rgba(37,211,102,.45);
      animation: latido 1.6s infinite ease-in-out;
      pointer-events:none;
    }

    @keyframes latido{
      0%{
        transform: translateY(var(--y)) scale(1);
        box-shadow: 0 0 0 0 rgba(37,211,102,.45);
      }
      70%{
        transform: translateY(var(--y)) scale(var(--scale));
        box-shadow: 0 0 0 var(--spread) rgba(37,211,102,0);
      }
      100%{
        transform: translateY(var(--y)) scale(1);
        box-shadow: 0 0 0 0 rgba(37,211,102,0);
      }
    }

    .legal{
      position:absolute;
      bottom: 10px;
      width:100%;
      text-align:center;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <a class="cta-hotspot"
       href="https://wa.me/5491156100611"
       target="_blank"
       rel="noopener"
       aria-label="Entrar por WhatsApp">
       Entrar por WhatsApp
    </a>

    <div class="legal">Ingreso exclusivo, solo para +18</div>
  </div>
</body>
</html>
