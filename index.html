<!DOCTYPE html>
<html lang="es">
<head>

      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {

    }

    p {

    }
    a {
      display: block;
      margin-top: 20px;
      padding: 15px;
      background: #25d366;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }
    .small {
      font-size: 12px;
      margin-top: 15px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contacto por WhatsApp</h1>
    <p>Escribinos por WhatsApp para recibir información.</p>

    <a href="https://wa.me/5491156100611" target="_blank">
      Hablar por WhatsApp
    </a>

    <div class="small">

    </div>
  </div>

</html>
