<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <link rel="preload" as="image" href="fondo4.png">

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio: 9 / 16;
      background:url("fondo4.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* ================= BOTÓN WHATSAPP (igual a la referencia) ================= */

    .cta-hotspot{
      /* paleta oro */
      --gold1:#ffe3a0;
      --gold2:#ffbe41;
      --gold3:#7a4b00;

      position:absolute;
      left:50%;
      bottom: 22%;
      transform: translateX(-50%);

      width: 82%;
      height: 78px;
      padding: 0 26px;
      border-radius: 999px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap: 16px;

      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
      user-select:none;

      /* Texto (dorado suave) */
      color:#f7e7b3;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: .2px;
      text-shadow: 0 2px 0 rgba(0,0,0,.65);

      /* Fondo verde premium */
      background:
        radial-gradient(120% 180% at 50% 0%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0f4f27 0%, #052012 100%);

      /* Glow + profundidad (suave, como la imagen) */
      box-shadow:
        0 0 26px rgba(255, 187, 45, .22),
        0 0 70px rgba(255, 160, 0, .10),
        0 16px 26px rgba(0,0,0,.55),
        inset 0 2px 0 rgba(255,255,255,.10),
        inset 0 -10px 18px rgba(0,0,0,.62);

      position:relative;
    }

    /* Marco dorado externo */
    .cta-hotspot::before{
      content:"";
      position:absolute;
      inset:-3px;
      border-radius:999px;
      background: linear-gradient(180deg, var(--gold1) 0%, var(--gold2) 55%, var(--gold3) 100%);
      z-index:-1;
      filter: drop-shadow(0 0 14px rgba(255, 190, 60, .28));
    }

    /* Línea dorada interna (doble borde) */
    .cta-hotspot::after{
      content:"";
      position:absolute;
      inset: 3px;
      border-radius:999px;
      border: 1px solid rgba(255, 214, 120, .28);
      pointer-events:none;
    }

    /* Círculo del ícono (como la referencia) */
    .wa-badge{
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display:grid;
      place-items:center;
      flex: 0 0 auto;

      background:
        radial-gradient(circle at 30% 25%, #49ff93 0%, #1aa84d 42%, #0b4a24 100%);

      border: 2px solid rgba(255, 200, 95, .55);
      box-shadow:
        0 10px 18px rgba(0,0,0,.45),
        inset 0 2px 0 rgba(255,255,255,.18);
    }

    .wa-icon{
      width: 24px;
      height: 24px;
      display:block;
    }

    /* Hover/press */
    .cta-hotspot:hover{
      transform: translateX(-50%) translateY(-1px);
    }
    .cta-hotspot:active{
      transform: translateX(-50%) scale(.99);
    }

    /* ================= LEGAL ================= */
    .legal{
      position:absolute;
      bottom: 10px;
      width:100%;
      text-align:center;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>

</body>
</html>
