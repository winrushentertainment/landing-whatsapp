<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      background:#0b1020;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio: 9 / 16;
      background:url("fondo3.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;

      /* 🔧 AJUSTE FINO DEL LATIDO */
      --y: 6px;        /* subir (-) / bajar (+) */
      --inset: 8px;    /* grosor interno */
      --spread: 14px;  /* tamaño del halo */
      --scale: 1.06;   /* intensidad */
    }

    .cta-hotspot{
  position:absolute;
  left:50%;
  transform: translateX(-50%);
  bottom: 22%;
  width: 78%;
  height: 68px;
  border-radius: 999px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  background: linear-gradient(180deg, #1a1a1a, #000);
  color:#f5c86a;
  font-weight:900;
  font-size:20px;
  letter-spacing:1px;
  text-decoration:none;

  border: 2px solid rgba(245,200,106,.55);
  box-shadow:
    0 0 18px rgba(245,200,106,.35),
    inset 0 0 12px rgba(245,200,106,.15);

  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}

/* Icono WhatsApp discreto */
.cta-hotspot .wa-icon{
  width:22px;
  height:22px;
  color:#f5c86a;
  opacity:.85;
}

/* Latido sutil (casino, no whatsapp) */
.cta-hotspot::before{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:999px;
  box-shadow: 0 0 0 0 rgba(245,200,106,.45);
  animation: latido 2s infinite ease-out;
  pointer-events:none;
}


    @keyframes latido{
      0%{
        transform: translateY(var(--y)) scale(1);
        box-shadow: 0 0 0 0 rgba(37,211,102,.45);
      }
      70%{
        transform: translateY(var(--y)) scale(var(--scale));
        box-shadow: 0 0 0 var(--spread) rgba(37,211,102,0);
      }
      100%{
        transform: translateY(var(--y)) scale(1);
        box-shadow: 0 0 0 0 rgba(37,211,102,0);
      }
    }

    .legal{
      position:absolute;
      bottom: 10px;
      width:100%;
      text-align:center;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

   target="_blank"
   rel="noopener"
