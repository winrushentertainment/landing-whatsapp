<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WinRush</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: url("fondo.png") center top / contain no-repeat;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .overlay {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-whatsapp {
  background: linear-gradient(135deg, #25d366, #1ebe5d);
  color: #000;
  padding: 16px 42px;
  border-radius: 999px;
  font-size: 18px;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 0 0 rgba(37, 211, 102, 0.7);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
    transform: scale(1);
  }
  70% {
    box-shadow: 0 0 0 18px rgba(37, 211, 102, 0);
    transform: scale(1.05);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
    transform: scale(1);
  }
}

    .small {
      font-size: 11px;
      color: #ffffff;
      opacity: 0.9;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>

<body>
  <div class="overlay">
    <a
      class="btn-whatsapp"
      href="https://wa.me/5491156100611"
      target="_blank"
    >
      WhatsApp
    </a>

    <div class="small">
      Solo para mayores de 18 años
    </div>
  </div>
</body>
</html>
