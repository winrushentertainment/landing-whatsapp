<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WinRush</title>

<style>
  body {
    margin: 0;
    background: #0b1020;
    display: flex;
    justify-content: center;
  }

  .wrapper {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 9 / 16;
    background: url("fondo.png") no-repeat center top;
    background-size: contain;
  }

  .cta {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
  }

  .cta a {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(180deg, #2aff6a, #1fbf55);
    color: #000;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: bold;
    font-size: 18px;
    text-decoration: none;
    box-shadow: 0 0 25px rgba(42,255,106,.6);
    animation: pulse 1.6s infinite;
  }

  .cta img {
    width: 26px;
    height: 26px;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .legal {
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: #fff;
    opacity: .7;
  }
</style>
</head>

<body>
  <div class="wrapper">

    <div class="cta">
      <a href="https://wa.me/5491156100611" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
        WhatsApp
      </a>
    </div>

    <div class="legal">
      Solo para mayores de 18 años
    </div>

  </div>
</body>
</html>
