<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <!-- Preload fondo -->
  <link rel="preload" as="image" href="fondo4.png">

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio:9/16;
      background:url("fondo4.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* ================= BOTÓN WHATSAPP ================= */

    .cta-hotspot{
      --gold1:#ffd36a;
      --gold2:#ffb52e;
      --gold3:#7a4b00;

      position:absolute;
      left:50%;
      bottom:22%;
      transform:translateX(-50%);

      width:78%;
      height:74px;
      padding:0 26px;
      border-radius:999px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;

      text-decoration:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;

      /* Texto */
      color:#f7e7b3;
      font-weight:900;
      font-size:22px;
      letter-spacing:.3px;
      text-shadow:0 2px 0 rgba(0,0,0,.65);

      /* Fondo verde premium */
      background:
        radial-gradient(120% 180% at 50% 0%, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0e4b25 0%, #062713 100%);

      /* Profundidad + glow */
      box-shadow:
        0 0 28px rgba(255,187,45,.30),
        0 0 90px rgba(255,140,0,.10),
        0 18px 32px rgba(0,0,0,.55),
        inset 0 2px 0 rgba(255,255,255,.10),
        inset 0 -8px 16px rgba(0,0,0,.55);

      animation:pulseGold 2.2s infinite ease-out;
    }

    /* Borde dorado externo */
    .cta-hotspot::before{
      content:"";
      position:absolute;
      inset:-3px;
      border-radius:999px;
      background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));
      z-index:-1;
      filter:drop-shadow(0 0 18px rgba(255,190,60,.35));
    }

    /* Línea dorada interna */
    .cta-hotspot::after{
      content:"";
      position:absolute;
      inset:3px;
      border-radius:999px;
      border:1px solid rgba(255,214,120,.28);
      pointer-events:none;
    }

    /* Icono WhatsApp */
    .wa-icon{
      width:26px;
      height:26px;
      color:#fff;

      background:
        radial-gradient(circle at 30% 25%, #49ff93 0%, #1aa84d 42%, #0b4a24 100%);
      border-radius:50%;
      padding:10px;

      border:2px solid rgba(255,200,95,.55);
      box-shadow:
        0 10px 18px rgba(0,0,0,.45),
        inset 0 2px 0 rgba(255,255,255,.18);
    }

    /* Hover desktop */
    .cta-hotspot:hover{
      transform:translateX(-50%) translateY(-1px);
    }

    /* Press mobile */
    .cta-hotspot:active{
      transform:translateX(-50%) scale(.99);
    }

    /* Latido sutil */
    @keyframes pulseGold{
      0%{ filter:drop-shadow(0 0 0 rgba(255,187,45,0)); }
      55%{ filter:drop-shadow(0 0 10px rgba(255,187,45,.28)); }
      100%{ filter:drop-shadow(0 0 0 rgba(255,187,45,0)); }
    }

    /* ================= LEGAL ================= */

    .legal{
      position:absolute;
      bottom:10px;
      width:100%;
      text-align:center;
      font-size:12px;
      font-weight:600;
      color:rgba(255,255,255,.7);
      text-shadow:0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

        <path fill="currentColor" d="M26.67 5.33A12.9 12.9 0 0016.02 1C8.86 1 3.03 6.83 3.03 13.99c0 2.27.59 4.49 1.71 6.46L3 31l10.82-1.68a12.93 12.93 0 006.2 1.58h.01c7.16 0 12.99-5.83 12.99-12.99 0-3.47-1.35-6.73-3.35-9.58zM20.02 28.5h-.01a10.8 10.8 0 01-5.51-1.51l-.39-.23-6.42 1 1.04-6.26-.25-.41a10.79 10.79 0 01-1.65-5.74C6.83 8 10.84 4 16.02 4c2.88 0 5.6 1.12 7.64 3.16A10.74 10.74 0 0126.83 15.9c0 5.18-4.01 12.6-6.81 12.6z"/>

</body>
</html>
