<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso WhatsApp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          rgba(0,0,0,0.45),
          rgba(0,0,0,0.45)
        ),
        url("fondo.png") center/contain no-repeat;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .container {
      text-align: center;
      width: 100%;
      padding: 20px;
    }

    .btn {
      display: inline-block;
      padding: 18px 38px;
      background: #25d366;
      color: #000;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 14px 35px rgba(37,211,102,0.7);
    }

    .note {
      position: absolute;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      opacity: 0.45;
    }
  </style>
</head>

<body>
  <div class="container">
    <a
      class="btn"
      href="https://wa.me/5491156100611"
      target="_blank"
    >
      WhatsApp
    </a>
  </div>

  <div class="note">
    Solo para mayores de 18 años
  </div>
</body>
</html>
