<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <style>
    * { box-sizing: border-box; }
    @keyframes latido {
  0% {
    transform: translateX(-50%) scale(1);
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
  }
  70% {
    transform: translateX(-50%) scale(1.06);
    box-shadow: 0 0 0 18px rgba(37, 211, 102, 0);
  }
  100% {
    transform: translateX(-50%) scale(1);
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
  }
}

.cta-hotspot {
  animation: latido 1.6s infinite;
  .cta-hotspot {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 24%;
  width: 78%;
  height: 72px;
  border-radius: 999px;
  cursor: pointer;
}

/* Capa del latido */
.cta-hotspot::before {
  content: "";
  position: absolute;
  inset: 6px; /* ajusta altura real del botón */
  border-radius: 999px;
  box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.45);
  animation: latido 1.6s infinite;
}

@keyframes latido {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.45);
  }
  70% {
    transform: scale(1.06);
    box-shadow: 0 0 0 4px rgba(37, 211, 102, 0);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
  }
}

}


    body{
      margin:0;
      background:#0b1020;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio: 9 / 16;
      background:url("fondo2.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* Área clickeable sobre el botón del diseño */
    .cta-hotspot{
      position:absolute;
      left:50%;
      transform: translateX(-50%);
      bottom: 24%;
      width: 78%;
      height: 72px;
      border-radius: 999px;
      text-indent:-9999px;
      overflow:hidden;
      cursor:pointer;
    }

    .legal{
      position:absolute;
      bottom: 10px;
      width:100%;
      text-align:center;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <a class="cta-hotspot"
       href="https://wa.me/5491156100611"
       target="_blank"
       rel="noopener"
       aria-label="Presione aquí">
       Presione aquí
    </a>

    <div class="legal">Ingreso exclusivo, solo para +18</div>
  </div>
</body>
</html>
