<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <link rel="preload" as="image" href="fondo4.png">

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio: 9 / 16;
      background:url("fondo4.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* ✅ HOTSPOT INVISIBLE (100% idéntico visualmente) */
    .cta-hotspot{
      position:absolute;
      left:50%;
      transform: translateX(-50%);
      bottom: 22%;

      /* Ajustá SOLO estas 3 si necesitás alinearlo al pixel */
      width: 82%;
      height: 88px;
      border-radius: 999px;

      /* invisible pero clickeable */
      background: transparent;
      border: none;
      outline: none;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select:none;

      /* para que no seleccione nada */
      text-indent: -9999px;
      overflow: hidden;
      white-space: nowrap;
    }

    /* accesibilidad: foco visible al navegar con teclado */
    .cta-hotspot:focus-visible{
      box-shadow: 0 0 0 3px rgba(255, 200, 90, .55);
    }

    /* feedback sutil (no cambia el diseño) */
    .cta-hotspot:active{
      transform: translateX(-50%) scale(.995);
    }

    .legal{
      position:absolute;
      bottom: 10px;
      width:100%;
      text-align:center;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <a class="cta-hotspot"
       href="https://wa.me/5491156100611?text=Quiero%20mi%20bono%20de%20bienvenida!!!"
       target="_blank"
       rel="noopener"
       aria-label="Acceder por WhatsApp">
      Acceder por WhatsApp
    </a>

    <div class="legal">Ingreso exclusivo, solo para +18</div>
  </div>
</body>
</html>
