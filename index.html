<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | WhatsApp</title>

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      background:#0b1020;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio: 9 / 16;
      background:url("fondo2.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* ✅ Link invisible arriba del botón que está en la imagen */
    .cta-hotspot{
      position:absolute;
      left:50%;
      transform: translateX(-50%);
      bottom: 24%;              /* 👈 ajustá este % si hace falta */
      width: 78%;               /* 👈 ancho del botón del diseño */
      height: 72px;             /* 👈 alto del botón del diseño */
      border-radius: 999px;
      text-indent:-9999px;      /* accesible sin texto visible */
      overflow:hidden;
      /* opcional para debug: */
      /* outline: 2px dashed lime; background: rgba(0,255,0,.15); */
    }

    .legal{
      position:absolute;
      bottom: 10px;
      width:100%;
      text-align:center;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <a class="cta-hotspot"
       href="https://wa.me/5491156100611"
       target="_blank"
       rel="noopener"
       aria-label="Entrar por WhatsApp">
       Entrar por WhatsApp
    </a>

    <div class="legal">Ingreso exclusivo, solo para +18</div>
  </div>
</body>
</html>
