<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <link rel="preload" as="image" href="fondo4.png">

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio:9/16;
      background:url("fondo4.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* ================= BOTÓN ================= */

    .cta-hotspot{
      position:absolute;
      left:50%;
      bottom:22%;
      transform:translateX(-50%);

      width:78%;
      height:70px;
      padding:0 26px;
      border-radius:999px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;

      text-decoration:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;

      /* TEXTO */
      color:#fff3c4;
      font-weight:900;
      font-size:22px;
      letter-spacing:.3px;
      text-shadow:0 2px 6px rgba(0,0,0,.45);

      /* FONDO DORADO (NO VERDE) */
      background:linear-gradient(
        180deg,
        #ffd87a 0%,
        #f2b93b 55%,
        #d69a1c 100%
      );

      /* SOMBRA SUAVE COMO EN LA IMAGEN */
      box-shadow:
        0 10px 20px rgba(0,0,0,.35),
        inset 0 2px 0 rgba(255,255,255,.35);

      animation:pulse 2.4s infinite ease-out;
    }

    /* BORDE DORADO */
    .cta-hotspot::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:999px;
      background:linear-gradient(
        180deg,
        #fff0b5,
        #f2b93b,
        #b97a12
      );
      z-index:-1;
    }

    /* LED VERDE SIMPLE */
    .wa-icon{
      width:16px;
      height:16px;
      border-radius:50%;
      background:#3cff6b;
      box-shadow:0 0 6px rgba(60,255,107,.6);
      flex-shrink:0;
    }

    /* HOVER */
    .cta-hotspot:hover{
      transform:translateX(-50%) translateY(-1px);
    }

    /* PRESS MOBILE */
    .cta-hotspot:active{
      transform:translateX(-50%) scale(.98);
    }

    /* LATIDO SUAVE */
    @keyframes pulse{
      0%{
        box-shadow:
          0 10px 20px rgba(0,0,0,.35),
          inset 0 2px 0 rgba(255,255,255,.35);
      }
      60%{
        box-shadow:
          0 14px 26px rgba(0,0,0,.40),
          inset 0 2px 0 rgba(255,255,255,.45);
      }
      100%{
        box-shadow:
          0 10px 20px rgba(0,0,0,.35),
          inset 0 2px 0 rgba(255,255,255,.35);
      }
    }

    /* ================= LEGAL ================= */

    .legal{
      position:absolute;
      bottom:10px;
      width:100%;
      text-align:center;
      font-size:12px;
      font-weight:600;
      color:rgba(255,255,255,.7);
      text-shadow:0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <a class="cta-hotspot"
       href="https://wa.me/5491156100611?text=Quiero%20mi%20bono%20de%20bienvenida!!!"
       target="_blank"
       rel="noopener"
       aria-label="Acceder por WhatsApp">

      <span class="wa-icon"></span>
      <span>Acceder por WhatsApp</span>

    </a>

    <div class="legal">Ingreso exclusivo, solo para +18</div>
  </div>
</body>
</html>
