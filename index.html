<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinRush | Acceso</title>

  <link rel="preload" as="image" href="fondo4.png">

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0b1020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrapper{
      position:relative;
      width:100%;
      max-width:420px;
      aspect-ratio:9/16;
      background:url("fondo6.png") no-repeat center center;
      background-size:cover;
      overflow:hidden;
    }

    /* ================= HOTSPOT CON LATIDO DORADO ================= */

    .cta-hotspot{
      position:absolute;
      left:50%;
      bottom:34,5%;
      transform:translateX(-50%);

      /* AJUSTÁ SOLO ESTOS 3 SI HACE FALTA */
      width:82%;
      height:88px;
      border-radius:999px;

      background:transparent;
      border:none;
      outline:none;
      cursor:pointer;

      -webkit-tap-highlight-color:transparent;
      user-select:none;

      /* importante para accesibilidad */
      text-indent:-9999px;
      overflow:hidden;
      white-space:nowrap;
    }

    /* LATIDO DORADO (VISIBLE) */
    .cta-hotspot::before{
      content:"";
      position:absolute;
      inset:6px;
      border-radius:999px;
      box-shadow:0 0 0 0 rgba(255, 190, 80, .55);
      animation:latido 1.6s infinite ease-out;
      pointer-events:none;
    }

    @keyframes latido{
      0%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(255,190,80,.55);
        opacity:1;
      }
      65%{
        transform:scale(1.12);
        box-shadow:0 0 0 22px rgba(255,190,80,0);
        opacity:.85;
      }
      100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(255,190,80,0);
        opacity:0;
      }
    }

    /* feedback táctil (no cambia el diseño) */
    .cta-hotspot:active{
      transform:translateX(-50%) scale(.995);
    }

    .cta-hotspot:focus-visible{
      box-shadow:0 0 0 3px rgba(255,200,90,.55);
    }

    /* ================= LEGAL ================= */

    .legal{
      position:absolute;
      bottom:10px;
      width:100%;
      text-align:center;
      font-size:12px;
      font-weight:600;
      color:rgba(255,255,255,.70);
      text-shadow:0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <a class="cta-hotspot"
       href="https://wa.me/5491156100611?text=Quiero%20mi%20bono%20de%20bienvenida!!!"
       target="_blank"
       rel="noopener"
       aria-label="Acceder por WhatsApp">
      Acceder por WhatsApp
    </a>

    <div class="legal">Ingreso exclusivo, solo para +18</div>
  </div>
</body>
</html>
